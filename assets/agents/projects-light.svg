.spin{animation:spin 2.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.arL{animation:arL 1.3s cubic-bezier(.5,0,.7,1) infinite}.arR{animation:arR 1.3s cubic-bezier(.5,0,.7,1) infinite}
